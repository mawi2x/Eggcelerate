[project]
name = "eggcelerate-api"
version = "0.1.0"
description = "EGGCELERATE dashboard backend with staged PostgreSQL persistence"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
  "SQLAlchemy[asyncio]==2.0.52",
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "paho-mqtt==2.1.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.7",
  "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::pydantic.warnings.UnsupportedFieldAttributeWarning"]

# Update policy: exact pins. Bump one dependency at a time, re-run the full
# API suite plus the frontend contract gate, record the new pins here.

[tool.mypy]
python_version = "3.14"
files = ["src/eggcelerate_api"]
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["eggcelerate_api"]
