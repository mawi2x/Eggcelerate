# Sensor pilot: TLS and explicit device topic permissions.
listener 8883
allow_anonymous false
password_file /mosquitto/config/private/passwords
acl_file /mosquitto/config/acl
certfile /mosquitto/config/private/server.crt
keyfile /mosquitto/config/private/server.key
cafile /mosquitto/config/private/ca.crt
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
log_dest stdout
