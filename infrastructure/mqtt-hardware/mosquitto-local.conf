# Local empty-chamber recorder; same topic ACL and passwords, separate TLS CA.
listener 8883
allow_anonymous false
password_file /mosquitto/config/private/passwords
acl_file /mosquitto/config/acl
certfile /mosquitto/config/private/local-server.crt
keyfile /mosquitto/config/private/server.key
cafile /mosquitto/config/private/local-ca.crt
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
log_dest stdout
