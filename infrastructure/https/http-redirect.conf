# Temporary port-80 front door while the original web container owns HTTP.
# Keep the ACME bridge connected until the HTTPS proxy takes ownership of port 80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://acme-edge;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://4.193.224.4$request_uri;
    }
}
