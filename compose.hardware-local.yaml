# Local rehearsal with isolated project name and loopback-only ports.
services:
  api:
    environment:
      CLIMATE_CONTROL_ENABLED: "true"
      TRAY_CONTROL_ENABLED: "true"
  web:
    ports: !override
      - "127.0.0.1:18080:80"
  dashboard-https:
    ports: !override
      - "127.0.0.1:18081:80"
      - "127.0.0.1:18443:443"
  hardware-broker:
    volumes:
      - ./infrastructure/mqtt-hardware/mosquitto-local.conf:/mosquitto/config/mosquitto.conf:ro
    ports: !override
      - "${LOCAL_MQTT_BIND_ADDRESS:-127.0.0.1}:18883:8883"
  db:
    ports: !override []
  hardware-telemetry:
    environment:
      CLIMATE_CONTROL_ENABLED: "true"
      TRAY_CONTROL_ENABLED: "true"
    volumes:
      - ./infrastructure/mqtt-hardware/private/local-ca.crt:/etc/eggcelerate/ca.crt:ro
