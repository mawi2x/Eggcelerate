name: api

on:
  push:
    branches: ["experiment", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: timescale/timescaledb:2.30.0-pg17@sha256:3113d12b78392c064aa7475caf7a52b447b29ddd4f9bfd23526733fcb03e3459
        env:
          POSTGRES_USER: eggcelerate
          POSTGRES_PASSWORD: eggcelerate_test
          POSTGRES_DB: eggcelerate_test
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U eggcelerate -d eggcelerate_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://eggcelerate:eggcelerate_test@127.0.0.1:55432/eggcelerate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python -m pip install -e 'apps/api[test]'
      - run: pnpm install --frozen-lockfile
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - run: python -m mypy
        working-directory: apps/api
      - run: python apps/api/scripts/verify_migrations.py
      - run: python -m pytest -q apps/api/tests --require-database
      - run: python apps/api/scripts/verify_live_contract.py
      - run: git diff --check
