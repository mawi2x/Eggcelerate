name: web

on:
  push:
    branches: ["experiment", "main"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter eggcelerate-ui typecheck
      - run: pnpm --filter eggcelerate-ui test
      - run: pnpm --filter eggcelerate-ui coverage
      - run: pnpm --filter eggcelerate-ui build
      - run: git diff --check
