name: web

on:
  push:
    branches: ["experiment", "main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter eggcelerate-ui typecheck
      - run: pnpm --filter eggcelerate-ui coverage
      - run: pnpm --filter eggcelerate-ui test:assets
      - run: pnpm --filter eggcelerate-ui build
      - run: pnpm --filter eggcelerate-ui check:assets
      - run: git diff --check
      - name: Publish coverage and loading reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-verification
          path: |
            apps/web/coverage/
            apps/web/dist/.vite/
          include-hidden-files: true
          retention-days: 14
