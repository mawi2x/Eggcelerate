# Authenticated production-shaped overlay. Public release still depends on the
# Phase 9 operational gates documented in the Phase 8 handoff.
services:
  web:
    build:
      args:
        VITE_DATA_SOURCE: api
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    # Check API readiness without requiring an authenticated dashboard session.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    environment:
      STORAGE_BACKEND: postgres_incubators
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the production database}
      APP_ENV: production
      AUTH_MODE: sessions
      PUBLIC_REGISTRATION_ENABLED: "false"
      AUTH_RATE_LIMIT_KEY: ${AUTH_RATE_LIMIT_KEY:?Set a random 32+ character AUTH_RATE_LIMIT_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the HTTPS web origin}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
    # The web container reaches api over the Compose network; no host port is
    # needed for the team preview.
    ports: !override []

  db:
    # PostgreSQL is reachable only over the private Compose network here.
    ports: !override []
